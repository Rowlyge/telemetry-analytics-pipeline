name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kuflow_analytics
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: telemetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuflow_analytics -d telemetry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: telemetry
      POSTGRES_USER: kuflow_analytics
      POSTGRES_PASSWORD: ci_test_password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8)
        run: |
          flake8 ingest transform scripts reports tests \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E402 \
            --exclude=reports/output

      - name: Apply database schema
        run: |
          psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" \
            -f sql/schema/001_init.sql
          psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" \
            -f sql/schema/002_ingest_manifest.sql

      - name: Run tests (unit + integration)
        run: pytest -v